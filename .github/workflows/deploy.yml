name: Deploy Notes API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"

            cd ~/notes-api

            echo "==> Checking disk space"
            df -h /

            AVAILABLE=$(df --output=avail / | tail -1)

            if [ "$AVAILABLE" -lt 2097152 ]; then
              echo "ERROR: Less than 2 GB of disk space available."
              exit 1
            fi

            echo "==> Updating source code"
            git fetch origin
            git reset --hard origin/main

            echo "==> Cleaning npm cache"
            npm cache clean --force || true

            echo "==> Installing dependencies"
            npm ci

            echo "==> Generating Prisma client"
            npx prisma generate

            echo "==> Running database migrations"
            npx prisma migrate deploy

            echo "==> Building application"
            NODE_OPTIONS="--max-old-space-size=768" npm run build

            echo "==> Verifying build"
            test -f dist/src/main.js

            echo "==> Restarting application"
            pm2 restart notes-api --update-env

            echo "==> Checking application status"
            sleep 2
            pm2 status

            echo "==> Checking port 3000"
            if ! ss -lnt | grep -q ':3000 '; then
              echo "ERROR: Application is not listening on port 3000."
              pm2 logs notes-api --err --lines 30 --nostream
              exit 1
            fi

            echo "==> Deployment successful"
            df -h /