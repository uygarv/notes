name: Deploy Notes API

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"

            nvm install 22
            nvm use 22

            echo "==> Ensuring PM2 is available for Node $(node --version)"
            if ! command -v pm2 >/dev/null 2>&1; then
              npm install --global pm2
            fi

            cd ~/notes

            echo "==> Updating source code"
            git fetch origin
            git reset --hard origin/main

            echo "==> Checking disk space"
            df -h /

            AVAILABLE=$(df --output=avail / | tail -1 | tr -d ' ')

            if [ "$AVAILABLE" -lt 2097152 ]; then
              echo "ERROR: Less than 2 GB of disk space available."
              exit 1
            fi

            echo "==> Installing dependencies"
            npm ci

            echo "==> Generating Prisma client"
            cd apps/api
            npx prisma generate

            echo "==> Running database migrations"
            npx prisma migrate deploy

            cd ../..

            echo "==> Cleaning previous builds"
            rm -rf packages/*/dist
            rm -rf apps/api/dist

            echo "==> Building shared schemas"
            npm run build --workspace=@notes/schemas

            echo "==> Verifying schemas build"
            if [ ! -f packages/schemas/dist/index.js ]; then
              echo "ERROR: packages/schemas/dist/index.js was not generated."
              exit 1
            fi

            echo "==> Building shared contracts"
            npm run build --workspace=@notes/contracts

            echo "==> Verifying contracts build"
            if [ ! -f packages/contracts/dist/index.js ]; then
              echo "ERROR: packages/contracts/dist/index.js was not generated."
              exit 1
            fi

            echo "==> Building API"
            NODE_OPTIONS="--max-old-space-size=768" npm run build --workspace=notes-api

            echo "==> Verifying API build"
            if [ ! -f apps/api/dist/src/main.js ]; then
              echo "ERROR: apps/api/dist/src/main.js was not generated."
              exit 1
            fi

            echo "==> Verifying collaboration build"
            if [ ! -f apps/api/dist/src/collaboration/main.js ]; then
              echo "ERROR: apps/api/dist/src/collaboration/main.js was not generated."
              exit 1
            fi

            echo "==> Restarting API"
            pm2 delete notes-api || true

            pm2 start dist/src/main.js \
              --name notes-api \
              --cwd "$HOME/notes/apps/api" \
              --update-env

            echo "==> Restarting collaboration service"
            pm2 delete notes-collab || true

            pm2 start dist/src/collaboration/main.js \
              --name notes-collab \
              --cwd "$HOME/notes/apps/api" \
              --update-env

            echo "==> Waiting for application health check"
            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3000/ >/dev/null; then
                echo "Application is healthy."
                break
              fi

              if [ "$attempt" -eq 15 ]; then
                echo "ERROR: Application did not become healthy on port 3000."
                pm2 describe notes-api || true
                pm2 logs notes-api --lines 50 --nostream || true
                exit 1
              fi

              sleep 2
            done

            echo "==> Waiting for collaboration health check"
            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3002/ >/dev/null; then
                echo "Collaboration service is healthy."
                break
              fi

              if [ "$attempt" -eq 15 ]; then
                echo "ERROR: Collaboration service did not become healthy on port 3002."
                pm2 describe notes-collab || true
                pm2 logs notes-collab --lines 50 --nostream || true
                exit 1
              fi

              sleep 2
            done

            echo "==> Saving PM2 process list"
            pm2 save

            echo "==> Cleaning npm cache"
            npm cache clean --force || true

            echo "==> Deployment successful"
            pm2 list
            df -h /