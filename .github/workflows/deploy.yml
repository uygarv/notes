name: Deploy Notes API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"

            cd ~/notes

            echo "==> Updating source code"
            git fetch origin
            git reset --hard origin/main

            echo "==> Checking disk space"
            df -h /

            AVAILABLE=$(df --output=avail / | tail -1 | tr -d ' ')

            if [ "$AVAILABLE" -lt 2097152 ]; then
              echo "ERROR: Less than 2 GB of disk space available."
              exit 1
            fi

            echo "==> Installing dependencies"
            npm ci

            echo "==> Generating Prisma client"
            cd apps/api
            npx prisma generate

            echo "==> Running database migrations"
            npx prisma migrate deploy

            cd ../..

            echo "==> Cleaning previous builds"
            rm -rf packages/*/dist
            rm -rf apps/api/dist

            echo "==> Building shared schemas"
            npm run build --workspace=@notes/schemas

            echo "==> Verifying schemas build"
            if [ ! -f packages/schemas/dist/index.js ]; then
              echo "ERROR: packages/schemas/dist/index.js was not generated."
              exit 1
            fi

            echo "==> Building shared contracts"
            npm run build --workspace=@notes/contracts

            echo "==> Verifying contracts build"
            if [ ! -f packages/contracts/dist/index.js ]; then
              echo "ERROR: packages/contracts/dist/index.js was not generated."
              exit 1
            fi

            echo "==> Building API"
            NODE_OPTIONS="--max-old-space-size=768" npm run build --workspace=notes-api

            echo "==> Verifying API build"
            if [ ! -f apps/api/dist/src/main.js ]; then
              echo "ERROR: apps/api/dist/src/main.js was not generated."
              exit 1
            fi

            echo "==> Restarting application"
            pm2 restart notes-api --update-env

            echo "==> Waiting for application"
            sleep 3

            echo "==> Checking application status"
            if ! pm2 describe notes-api | grep -q "status.*online"; then
              echo "ERROR: PM2 application is not online."
              pm2 logs notes-api --err --lines 30 --nostream
              exit 1
            fi

            echo "==> Checking port 3000"
            if ! ss -lnt | grep -q ':3000 '; then
              echo "ERROR: Application is not listening on port 3000."
              pm2 logs notes-api --err --lines 30 --nostream
              exit 1
            fi

            echo "==> Cleaning npm cache"
            npm cache clean --force || true

            echo "==> Deployment successful"
            df -h /